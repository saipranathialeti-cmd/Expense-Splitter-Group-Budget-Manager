<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Splitter and Group Budget Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #edf1e8;
            color: #26332d;
            font-family: Georgia, "Times New Roman", serif;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 32px,
                rgba(90, 110, 90, 0.10) 33px
            );
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: 35px 20px 40px;
            position: relative;
            z-index: 1;
        }

        .title {
            text-align: center;
            font-size: 46px;
            margin: 0;
            font-weight: bold;
            color: #1f2c26;
        }

        .subtitle {
            text-align: center;
            margin: 18px auto 38px;
            max-width: 500px;
            font-family: "Courier New", monospace;
            font-size: 15px;
            line-height: 1.5;
            color: #587065;
        }

        .card {
            background-color: #fffdfa;
            border: 1px solid #cbd2c5;
            border-radius: 4px;
            padding: 38px 32px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .card-title {
            text-align: center;
            font-size: 24px;
            font-style: italic;
            margin: 0 0 35px;
            color: #1e2c25;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-family: "Courier New", monospace;
            font-size: 14px;
            color: #53675c;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 10px 13px;
            border: 1px solid #c7cec3;
            border-radius: 4px;
            background-color: #fffdfa;
            color: #26332d;
            font-family: "Courier New", monospace;
            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: #9aa69b;
        }

        input:focus {
            border-color: #a9781c;
            box-shadow: 0 0 0 2px rgba(169, 120, 28, 0.15);
        }

        .button {
            width: 100%;
            height: 50px;
            margin-top: 6px;
            border: none;
            border-radius: 4px;
            background-color: #202b26;
            color: white;
            font-family: "Courier New", monospace;
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #34443c;
        }

        .button:active {
            transform: translateY(1px);
        }

        .login-text {
            text-align: center;
            margin: 26px 0 0;
            font-family: "Courier New", monospace;
            font-size: 15px;
            color: #587065;
        }

        .login-text a {
            color: #344d60;
            text-decoration: underline;
            cursor: pointer;
        }

        .login-text a:hover {
            color: #1f3545;
        }

        .footer {
            text-align: center;
            margin-top: 42px;
            font-family: "Courier New", monospace;
            font-size: 13px;
            line-height: 1.7;
            color: #8a9a8d;
        }

        .error-message {
            display: none;
            margin-bottom: 18px;
            padding: 10px;
            border: 1px solid #d5aaa0;
            border-radius: 4px;
            background-color: #fff2ef;
            color: #8a4035;
            font-family: "Courier New", monospace;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 600px) {

            .container {
                padding: 25px 15px 30px;
            }

            .title {
                font-size: 38px;
            }

            .card {
                padding: 30px 22px;
            }

            .subtitle {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Project Title -->
        <h1 class="title">Expense Splitter</h1>

        <p class="subtitle">
            A simple way to manage group expenses,
            split costs, and see who owes whom.
        </p>

        <!-- Create Account Card -->
        <div class="card">

            <h2 class="card-title">Create an account</h2>

            <div id="errorMessage" class="error-message"></div>

            <form id="registerForm">

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required
                    >
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="name@gmail.com"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 6 characters"
                        minlength="6"
                        required
                    >
                </div>

                <!-- Create Account -->
                <button
                    type="submit"
                    class="button"
                >
                    Create account
                </button>

            </form>

            <!-- Login -->
            <p class="login-text">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </div>

        <!-- Footer -->
        <p class="footer">
            Only gmail.com addresses are accepted.
            Accounts and expenses are stored securely
            in the database.
        </p>

    </div>

    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
